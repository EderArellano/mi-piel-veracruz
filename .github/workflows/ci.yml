name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Type check · Lint · Schema
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Prisma generate/validate only need a valid-format URL — no real connection
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx next lint --max-warnings 0

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15

    env:
      # Placeholders — build just needs variables present, not real values
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      NEXTAUTH_SECRET: "ci-secret-not-real"
      NEXTAUTH_URL: "https://localhost:3000"
      NEXT_PUBLIC_APP_URL: "https://localhost:3000"
      NEXT_PUBLIC_CLINIC_NAME: "MiPiel Centro Dermocosmético"
      NEXT_PUBLIC_CLINIC_PHONE: "+52 229 933 00 14"
      NEXT_PUBLIC_CLINIC_EMAIL: "contacto@mipielveracruz.com"
      NEXT_PUBLIC_CLINIC_ADDRESS: "Boca del Río, Veracruz, México"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npx next build
